  for(let i=1;i<=mlPdfDoc.numPages;i++){const page=await mlPdfDoc.getPage(i);const vp=page.getViewport({scale:1.4});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const wrap=mlEl('div','scroll-page');wrap.appendChild(c);const n=mlEl('div','scroll-page-num','Page '+i+' / '+mlPdfDoc.numPages);wrap.appendChild(n);view.appendChild(wrap);}
}
function mlSyncUI(page){
  const total=mlTotal||1;
  $('mlSlider').max=Math.max(0,total-1);$('mlSlider').value=page||0;
  $('mlPageStatus').textContent=(page===0?'Cover':'Page '+page+' / '+(total-1))+' • '+(mlMode==='scroll'?'Scroll':'Flip')+' • '+(mlSpread?'2-Page':'1-Page');
  $('mlProgress').style.width=((page||0)/Math.max(1,total-1)*100)+'%';
}
function closeMiniLib(){mlDestroyFlip();$('miniLib').classList.add('hidden');$('mlScrollView').innerHTML='';mlBook=null;mlPdfDoc=null;}
function mlApplyZoom(){$('mlFrame').style.transform='scale('+mlZoom+')';$('mlFrame').style.transformOrigin='center center';document.getElementById('mlScrollView').style.setProperty('--scroll-zoom',mlZoom);}
function mlRebuildFlip(){
  if(!mlBook)return;
  if(mlMode==='scroll')return;
  if(mlIsPdf&&mlPdfDoc){mlBuildFlipPdf();}else{mlBuildFlipText(mlBook.pages||[mlBook.text||'']);}
}
$('mlPrev').onclick=()=>{if(mlFlip)mlFlip.flipPrev();};
$('mlNext').onclick=()=>{if(mlFlip)mlFlip.flipNext();};
$('mlSlider').oninput=e=>{if(mlFlip)mlFlip.flip(Number(e.target.value));};
$('mlZoomIn').onclick=()=>{mlZoom=Math.min(1.6,mlZoom+0.15);mlApplyZoom();};
$('mlZoomOut').onclick=()=>{mlZoom=Math.max(0.7,mlZoom-0.15);mlApplyZoom();};
$('mlSpread').onclick=()=>{mlSpread=!mlSpread;$('mlSpread').textContent=mlSpread?'📖 2 Pages':'📖 1 Page';$('mlFrame').classList.toggle('two-page',mlSpread);mlRebuildFlip();};
$('mlPeel').onclick=()=>{mlPeel=!mlPeel;$('mlPeel').textContent=mlPeel?'🪄 Peel: ON':'🪄 Peel: OFF';$('mlPeel').classList.toggle('active',mlPeel);$('mlHint').textContent=mlPeel?'Flip Mode - Peel ON = smooth curl • Peel OFF = fast flat':'Flip Mode - Peel OFF = fast flat • Peel ON = smooth curl';mlRebuildFlip();};
$('mlMode').onclick=async()=>{if(!mlIsPdf||!mlPdfDoc)return;if(mlMode==='flip'){mlMode='scroll';mlDestroyFlip();$('mlFlipStage').classList.add('hidden');$('mlScrollView').classList.remove('hidden');$('mlMode').textContent='📖 Flip Mode';await mlBuildScrollPdf();$('mlPageStatus').textContent='Scroll • Full PDF';}else{mlMode='flip';$('mlScrollView').classList.add('hidden');$('mlScrollView').innerHTML='';$('mlFlipStage').classList.remove('hidden');$('mlMode').textContent='↕ Scroll Mode';mlBuildFlipPdf();}};
let voiceRecorder=null,voiceChunks=[],voiceRecording=false,voiceBlobUrl='',voiceTranscript='',voiceFileName='';
function resetVoiceRec(){$('recBtn').textContent='● RECORD';$('recBtn').classList.remove('rec');$('recStatus').textContent='Tap to record in-app';voiceRecording=false;voiceTranscript='';voiceBlobUrl='';voiceFileName='';}
$('recBtn').onclick=async()=>{
  if(!voiceRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      voiceChunks=[];voiceRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'});
      voiceRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data);};
      voiceRecorder.onstop=async()=>{
        const blob=new Blob(voiceChunks,{type:'audio/webm'});
        voiceBlobUrl=URL.createObjectURL(blob);
        voiceFileName='voice-'+Date.now()+'.webm';
        $('recStatus').textContent='Transcribing… please wait';
        try{
          const fd=new FormData();fd.append('file',blob,voiceFileName);
          const r=await fetch('/.netlify/functions/transcribe',{method:'POST',body:fd});
          const j=await r.json();
          voiceTranscript=j.text||j.transcript||'';
          if(voiceTranscript){$('fText').value=voiceTranscript;$('recStatus').textContent='Done — transcript filled in. Tap SEAL.';}
          else $('recStatus').textContent='No speech heard — try again';
        }catch(e){$('recStatus').textContent='Transcribe failed — you can type it instead';}
      };
      voiceRecorder.start();voiceRecording=true;
      $('recBtn').textContent='■ STOP';$('recBtn').classList.add('rec');$('recStatus').textContent='Recording… tap STOP when done';
    }catch(e){$('recStatus').textContent='Mic blocked — allow mic in browser';}
  }else{
    try{voiceRecorder.stop();voiceRecorder.stream.getTracks().forEach(t=>t.stop());}catch(e){}
    voiceRecording=false;$('recBtn').textContent='● RECORD';$('recBtn').classList.remove('rec');$('recStatus').textContent='Stopping…';
  }
};
function activate(o){const u=o.userData;if(u.kind==='door')return goToRoom(u.id);if(u.kind==='psp'){openPSP();return;}if(u.kind==='chair'){showMsg('YOU SAT DOWN IN THE GAZEBO','good',2000);$('standBtn').classList.remove('hidden');openPSP();return;}const it=findItem(u.kind,u.id);if(!it)return;closePanel(true);const tags=it.tags&&it.tags.length?'  ·  #'+it.tags.join(' #'):'';if(u.kind==='thought'){pulled=o;const h=u.home||(u.home=o.position.clone());tween(.6,e=>{o.position.z=h.z+e*1.5;o.position.y=h.y+e*.25;o.rotation.y=e*.35;});openPanel(it.title,it.date+tags,it.text);}else if(u.kind==='book'){openMiniLib(it);}else if(u.kind==='voice'){holoPulse();openPanel('🎙 '+it.title,(it.category||'').toUpperCase()+' · '+it.date,'“'+it.transcript+'”',true,it.file);}else if(u.kind==='art'){zoomArt(o);openPanel(it.title,it.date,it.note,false,it.image);}}
function standUp(){$('standBtn').classList.add('hidden');closePSP();showMsg('YOU STOOD UP','good',1500);}
function zoomArt(o){const wp=new THREE.Vector3();o.getWorldPosition(wp);const n=new THREE.Vector3(0,0,1).applyQuaternion(o.quaternion);if(!savedCam)savedCam={pos:camPos(),look:curLook()};flyPath([camPos(),wp.clone().addScaledVector(n,5.2).toArray()],[curLook(),wp.toArray()],1.3);}
function selectItem(kind,id,roomId){goToRoom(roomId,()=>{const o=clickables.find(c=>c.userData.kind===kind&&c.userData.id===id);if(o)activate(o);});}
const SEARCH_DEFS=[['thoughts','thought','library','Library'],['voiceNotes','voice','music','Music Room'],['artworks','art','museum','Museum'],['books','book','library','Library']];
function runSearch(q){q=q.toLowerCase().trim();const R=$('results');R.innerHTML='';if(!q){R.classList.add('hidden');return;}SEARCH_DEFS.forEach(([key,kind,room,rn])=>(VAULT_DATA[key]||[]).forEach(it=>{const hay=[it.title,it.text,it.transcript,it.note,(it.tags||[]).join(' ')].join(' ').toLowerCase();if(hay.includes(q)){const d=document.createElement('div');d.className='res';d.innerHTML='<b></b><br><small></small>';d.children[0].textContent=it.title;d.children[2].textContent=rn+' · '+kind+' · '+it.date;d.onclick=()=>{R.classList.add('hidden');$('q').value='';selectItem(kind,it.id,room);};R.appendChild(d);}}));if(!R.children.length)R.innerHTML='<div class="res">Nothing found in the vault.</div>';R.classList.remove('hidden');}
let formKind='thought';
function openForm(k){if(!IS_OWNER){showMsg('GUESTS CANNOT SEAL','bad',1600);return;}formKind=k;const T={thought:['NEW THOUGHT','Title','Write the thought…'],voice:['NEW VOICE NOTE','Title','Transcript…'],link:['NEW LINK','Title','https://…'],upload:['NEW UPLOAD','Title / file name','Note about it…']}[k];$('fHead').textContent=T[0];$('fTitle').placeholder=T[1];$('fText').placeholder=T[2];$('fTitle').value=$('fText').value=$('fTags').value='';resetVoiceRec();$('voiceRecRow').classList.toggle('hidden',k!=='voice');$('fCat').classList.toggle('hidden',k!=='voice');$('fFile').classList.toggle('hidden',k!=='upload');if(k==='voice')$('fCat').value='new-voice-notes';$('form').classList.remove('hidden');}
function saveForm(){if(!IS_OWNER)return;const title=$('fTitle').value.trim(),text=$('fText').value.trim(),tags=$('fTags').value.split(',').map(s=>s.trim()).filter(Boolean);if(!title&&!text)return;let it;if(formKind==='thought'){it=addVaultItem('thoughts',{title:title||text.slice(0,30),text,tags});}else if(formKind==='voice'){it=addVaultItem('voiceNotes',{title:title||'Voice note',transcript:text||voiceTranscript,category:$('fCat').value,file:voiceBlobUrl||''});}else if(formKind==='link'){it=addVaultItem('thoughts',{title:title||text.slice(0,30),text,tags:[...tags,'link']});}else{it=addVaultItem('artworks',{title:title||'Upload',note:text,color:'#'+((Math.random()*0x888888|0)+0x555555).toString(16)});}$('form').classList.add('hidden');showMsg('SEALED IN THE VAULT','good',1600);sfx(660,.4,'sine',.08);resetVoiceRec();}
let ytPlaylist=[{id:'sVx1mJDeUjY',title:'Garden Song 1 — Your Link'},{id:'Vrr3lRLjZ1Y',title:'Garden Song 2 — From Your PSP'}];
let ytIndex=0,ytPlayer=null;
function onYouTubeIframeAPIReady(){try{ytPlayer=new YT.Player('yt-player');}catch(e){}}
function openPSP(){$('pspWrap').classList.remove('hidden');$('pspMini').classList.add('hidden');renderYTList();}
function minPSP(){$('pspWrap').classList.add('hidden');$('pspMini').classList.remove('hidden');}
function restorePSP(){$('pspMini').classList.add('hidden');$('pspWrap').classList.remove('hidden');}
function closePSP(silent){if(!silent)pspPause();$('pspWrap').classList.add('hidden');$('pspMini').classList.add('hidden');}
function setPSPTab(t){['Search','Paste','List'].forEach(n=>$('tab'+n).classList.toggle('active',n.toLowerCase()===t));$('paneSearch').classList.toggle('hidden',t!=='search');$('panePaste').classList.toggle('hidden',t!=='paste');if(t==='list')renderYTList();}
function loadYT(id,title){const f=$('yt-player');if(ytPlayer&&ytPlayer.loadVideoById)ytPlayer.loadVideoById(id);else f.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0&enablejsapi=1`; $('ytNow').textContent='Now Playing: '+(title||id);renderYTList();}
function doPSPSearch(){const q=$('pspSearch').value.trim();if(!q){alert('Type a song first');return;}$('yt-player').src=`https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}&autoplay=1&rel=0&enablejsapi=1`; $('ytNow').textContent='Searching: '+q+' — Use ⏭ to skip';}
function parseYT(u){u=u.trim();const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);if(m)return m[1];if(/^[A-Za-z0-9_-]{11}$/.test(u))return u;return null;}
function doPSPPaste(){const id=parseYT($('pspPaste').value);if(!id){alert('Paste a YouTube link');return;}ytPlaylist.push({id,title:'YouTube — '+id});ytIndex=ytPlaylist.length-1;loadYT(id,'YouTube — '+id);}
function pspPrev(){ytIndex=(ytIndex-1+ytPlaylist.length)%ytPlaylist.length;loadYT(ytPlaylist[ytIndex].id,ytPlaylist[ytIndex].title);}
function pspNext(){ytIndex=(ytIndex+1)%ytPlaylist.length;loadYT(ytPlaylist[ytIndex].id,ytPlaylist[ytIndex].title);}
function pspPlay(){if(ytPlayer)ytPlayer.playVideo();}
function pspPause(){if(ytPlayer)try{ytPlayer.pauseVideo();}catch(e){}}
function renderYTList(){$('ytList').innerHTML=ytPlaylist.map((s,i)=>`<div class="res" onclick="ytIndex=${i};loadYT('${s.id}','${s.title.replace(/'/g,'')}')">${i===ytIndex?'▶ ':''}${s.title}</div>`).join('');}
const cv=renderer.domElement,ray=new THREE.Raycaster(),mv=new THREE.Vector2();let pd=null;
function pick(x,y){mv.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(mv,camera);const hits=ray.intersectObjects(clickables.filter(o=>o.userData.roomId===current),true);for(const h of hits){let o=h.object;while(o&&!o.userData.kind)o=o.parent;if(o)return o;}return null;}
function drag(dx,dy){view.yaw=clamp(view.yaw+dx*.004,view.yaw0-1,view.yaw0+1);if(current==='museum'){const r=ROOMS.museum.api.range;camera.position.z=clamp(camera.position.z+dy*.035,r[0],r[1]);camera.position.x=clamp(camera.position.x+dx*.02,-1.2,1.2);}else view.pitch=clamp(view.pitch+dy*.004,view.pitch0-.5,view.pitch0+.5);camera.rotation.set(view.pitch,view.yaw,0);}
cv.addEventListener('pointerdown',e=>{if(!$('miniLib').classList.contains('hidden'))return;pd={x:e.clientX,lx:e.clientX,ly:e.clientY,t:performance.now(),moved:0};});
cv.addEventListener('pointermove',e=>{if(!pd)return;if(!$('miniLib').classList.contains('hidden')){pd=null;return;}const dx=e.clientX-pd.lx,dy=e.clientY-pd.ly;pd.lx=e.clientX;pd.ly=e.clientY;pd.moved+=Math.abs(dx)+Math.abs(dy);if(flying||current==='vault'||current==='transit')return;drag(dx,dy);});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dt=performance.now()-pd.t,tx=e.clientX-pd.x,mvd=pd.moved;pd=null;if(flying||current==='vault'||current==='transit')return;if(!$('miniLib').classList.contains('hidden'))return;if(mvd<10&&dt<500){const o=pick(e.clientX,e.clientY);if(o)activate(o);return;}if(current==='hall'&&dt<380&&Math.abs(tx)>110)goToRoom(tx<0?'music':'library');});
$('back').onclick=()=>goToHall();
$('pClose').onclick=()=>closePanel();$('play').onclick=togglePlay;
$('openFile').onclick=()=>{if(CURRENT_FILE)window.open(CURRENT_FILE,'_blank');};
$('musicCats').querySelectorAll('button').forEach(b=>b.onclick=()=>{CURRENT_CAT=b.dataset.cat;$('musicCats').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));if(ROOMS.music&&ROOMS.music.api.render)ROOMS.music.api.render();});
addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();closePSP();closeMiniLib();$('form').classList.add('hidden');$('results').classList.add('hidden');}});
$('q').addEventListener('input',e=>runSearch(e.target.value));
$('quick').querySelectorAll('button').forEach(b=>b.onclick=()=>openForm(b.dataset.k));
$('fSave').onclick=saveForm;$('fCancel').onclick=()=>{$('form').classList.add('hidden');resetVoiceRec();};
$('fFile').onchange=e=>{const f=e.target.files[0];if(f&&!$('fTitle').value)$('fTitle').value=f.name;};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(current==='vault'&&!flying)placeVaultCam();});
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;stepAnims(dt);stepParticles(dt);if(current==='vault'&&!flying){const v=vaultCam();camera.position.set(shake,v.pos[1]+Math.sin(t*.6)*.1,v.pos[2]);camera.lookAt(...v.look);}holo.rotation.y+=dt*.35;holoRing.rotation.x=Math.sin(t*.8)*.25;dust.rotation.y+=dt*.01;const gp=.07+.04*Math.sin(t*1.5);doorGlows.forEach((m,i)=>m.material.opacity=gp+.03*Math.sin(t*2+i));for(const k in ROOMS)ROOMS[k].api.update&&ROOMS[k].api.update(dt,t);headlight.position.copy(camera.position);headlight.position.y+=1;renderer.render(scene,camera);}
function init(){loadUserItems();$('menuBtns').innerHTML='';const hb=document.createElement('button');hb.className='btn s';hb.textContent='Hall';hb.onclick=()=>goToHall();$('menuBtns').appendChild(hb);ROOMS_LIST.forEach(createRoom);const sb=document.createElement('button');sb.className='btn s';sb.textContent='Search';sb.onclick=()=>$('q').focus();$('menuBtns').appendChild(sb);rerenderAll();setLight(0xD4AF37,1.2,40);loop();}
Promise.race([Promise.all([document.fonts.load('700 40px Cinzel'),document.fonts.load('900 40px Cinzel')]),new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(init);
